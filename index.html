<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Resizer - Измени размер фотографий</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="wrapper">
        <!--背景 декоративные элементы -->
        <div class="background-light"></div>
        <div class="background-blur"></div>

        <div class="container">
            <!-- Заголовок -->
            <div class="header-section">
                <h1 class="title">Photo Resizer</h1>
                <p class="subtitle">Пакетное изменение размера фотографий за один клик</p>
            </div>

            <div class="content-wrapper">
                <!-- Левая панель - управление -->
                <aside class="sidebar">
                    <div class="sidebar-card">
                        <div class="card-header">
                            <h2 class="card-title">Параметры</h2>
                        </div>

                        <!-- Ввод размеров -->
                        <div class="input-group">
                            <label for="width" class="label">Ширина (px)</label>
                            <input 
                                type="number" 
                                id="width" 
                                min="1" 
                                placeholder="800"
                                class="input-field"
                            >
                        </div>

                        <div class="input-group">
                            <label for="height" class="label">Высота (px)</label>
                            <input 
                                type="number" 
                                id="height" 
                                min="1" 
                                placeholder="600"
                                class="input-field"
                            >
                        </div>

                        <!-- Кнопка загрузки -->
                        <button id="uploadBtn" class="btn btn-primary">
                            Выбрать фото
                        </button>

                        <input 
                            type="file" 
                            id="fileInput" 
                            multiple 
                            accept="image/*" 
                            style="display: none;"
                        >

                        <!-- Кнопка изменения размера -->
                        <button id="resizeBtn" class="btn btn-action" disabled>
                            <span id="resizeBtnText">Изменить размер</span>
                        </button>

                        <!-- Информация -->
                        <div id="infoBox" class="info-card" style="display: none;">
                            <div class="info-item">
                                <span class="info-label">Фотографий:</span>
                                <span id="imageCount" class="info-value">0</span>
                            </div>
                            <div id="newSizeInfo" class="info-item" style="display: none;">
                                <span class="info-label">Новый размер:</span>
                                <span id="newSize" class="info-value"></span>
                            </div>
                        </div>
                    </div>
                </aside>

                <!-- Правая колонна - предпросмотр -->
                <section class="main-content">
                    <div id="dropZone" class="drop-zone">
                        <div class="drop-content">
                            <svg class="drop-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                <polyline points="17 8 12 3 7 8"></polyline>
                                <line x1="12" y1="3" x2="12" y2="15"></line>
                            </svg>
                            <h3 class="drop-title">Перетащите фото</h3>
                            <p class="drop-text">или нажмите чтобы выбрать</p>
                        </div>
                    </div>

                    <div id="galleryContainer" class="gallery-container" style="display: none;">
                        <div class="gallery-header">
                            <h2 class="gallery-title">Фото</h2>
                            <span class="gallery-count" id="galleryCount"></span>
                        </div>
                        <div id="gallery" class="gallery">
                            <!-- Фотографии будут добавлены сюда -->
                        </div>

                        <button id="addMoreBtn" class="btn btn-secondary">
                            + Добавить ещё
                        </button>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
